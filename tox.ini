[tox]
requires = tox-uv>=1
envlist =
    py38-pd134
    py39-pd15
    py310-pd20
    py311-pd21
    py311-pd22-np1
    py312-pd22-np2
    py313-pd3
    py314-pd3

[testenv]
package = skip
deps =
    pytest
    python-dotenv
    # runtime deps from setup.py (needed because we skip installing the package)
    requests>=2.26.0
    lxml>=4.6.4
    # pandas 1.3.4 (the README's stated minimum) - needs numpy < 2
    pd134: pandas==1.3.4
    pd134: numpy==1.21.6
    # pandas 1.5.x
    pd15: pandas==1.5.3
    pd15: numpy==1.24.4
    # pandas 2.0.x
    pd20: pandas==2.0.3
    pd20: numpy==1.26.4
    # pandas 2.1.x
    pd21: pandas==2.1.4
    pd21: numpy==1.26.4
    # pandas 2.2.x tested against both numpy majors
    pd22: pandas==2.2.3
    np1: numpy==1.26.4
    np2: numpy==2.4.6
    # pandas 3.0.x (requires Python >= 3.11 and numpy 2)
    pd3: pandas==3.0.6
    pd3: numpy==2.4.6
commands = pytest -v {posargs}
